name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # workflow_dispatch can be dispatched from any ref, so gate publishing on a v* tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${version}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run package && npx --yes @vscode/vsce@4.0.0 package
      # .vscodeignore cleanups have silently dropped Marketplace files before (0.17.0
      # shipped without a changelog), so check the real VSIX before publishing it.
      - name: Verify VSIX contents
        run: |
          for f in extension/changelog.md extension/readme.md extension/dist/extension.js; do
            unzip -l *.vsix | grep -q " $f$" || { echo "::error::VSIX is missing $f"; exit 1; }
          done
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath *.vsix -p "$VSCE_PAT"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish *.vsix -p "$OVSX_PAT"
